<script>

const el=id=>document.getElementById(id);

const archivedBoards=new Set();
function validBoardName(name){return typeof name==='string'&&name.trim()===name&&name.length>0&&name.length<=40}
try{
 const saved=JSON.parse(localStorage.getItem('moa-canvases'));
 if(Array.isArray(saved))for(const name of saved)if(validBoardName(name)&&!boards.includes(name))boards.push(name);
}catch{}
try{
 const removed=JSON.parse(localStorage.getItem('moa-removed-defaults'));
 if(Array.isArray(removed))for(const name of removed){const index=boards.indexOf(name);if(index>=0&&boards.length>1)boards.splice(index,1)}
}catch{}

}catch{}
try{
 const saved=JSON.parse(localStorage.getItem('moa-archived-canvases'));

}catch{}

function visibleBoards(){return boards.filter(name=>!archivedBoards.has(name))}
let folders=[],boardButtons=[],dragItem=null;
function validFolder(folder){return folder&&typeof folder.id==='string'&&folder.id&&validBoardName(folder.name)&&Array.isArray(folder.boards)&&folder.boards.every(validBoardName)}

 const saved=JSON.parse(localStorage.getItem('moa-folders'));
 if(Array.isArray(saved))folders=saved.filter(validFolder).map(folder=>({id:folder.id,name:folder.name,open:folder.open!==false,boards:folder.boards.filter(name=>boards.includes(name))}));
}catch{}
function saveFolders(){try{localStorage.setItem('moa-folders',JSON.stringify(folders))}catch{alert('폴더 변경 사항을 저장하지 못했어요.')}}

function customBoards(){return boards.filter(name=>!defaults.includes(name))}
function saveBoardNames(){
 localStorage.setItem('moa-canvases',JSON.stringify(customBoards()));
 localStorage.setItem('moa-removed-defaults',JSON.stringify(defaults.filter(name=>!boards.includes(name))));
 localStorage.setItem('moa-canvas-order',JSON.stringify(boards));
 localStorage.setItem('moa-archived-canvases',JSON.stringify([...archivedBoards]));

const kinds=['글','이미지','필사','링크','그룹','영상 파일','PDF','컷','자유'];

let db,cards=[],active=boards[0],editing,media='',hasInk=false,stroke=null,session=0, placement=null, pendingImage=0;

}
function blockOptions(select,placeholder){
 if(placeholder){const option=make('option',placeholder);option.value='';select.append(option)}
 for(const [type,name] of Object.entries(blockNames)){
   const option=make('option',name);option.value=type;select.append(option);

}
function moveBlock(index,offset){
 const destination=index+offset;
 if(destination<0||destination>=editBlocks.length)return;
 const [block]=editBlocks.splice(index,1);editBlocks.splice(destination,0,block);paintBlockEditor(block.id);
}
function paintBlockEditor(focus){
 const list=el('blockList');list.replaceChildren();
 for(const [index,block] of editBlocks.entries()){
   const row=make('div','','block-row'),controls=make('div','','block-controls');
   const type=document.createElement('select');type.setAttribute('aria-label','블록 '+(index+1)+' 종류');blockOptions(type);type.value=block.type;
   type.onchange=()=>{
     if(type.value!==block.type){blockUploads.delete(block.id);delete block.asset;delete block.data}
     block.type=type.value;paintBlockEditor(block.id);
   };
   const handle=make('span','⠿','block-handle');handle.title='끌어서 순서 바꾸기';handle.draggable=true;
   handle.ondragstart=event=>{draggedBlock=block.id;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',block.id)};
   handle.ondragend=()=>{draggedBlock=null;row.classList.remove('block-drop')};
   row.ondragover=event=>{if(draggedBlock){event.preventDefault();row.classList.add('block-drop')}};
   row.ondragleave=event=>{if(!row.contains(event.relatedTarget))row.classList.remove('block-drop')};
   row.ondrop=event=>{
     if(!draggedBlock)return;
     event.preventDefault();event.stopPropagation();
     const source=editBlocks.findIndex(item=>item.id===draggedBlock);draggedBlock=null;
     row.classList.remove('block-drop');if(source>=0&&source!==index)moveBlock(source,index-source);
   };
   controls.append(handle,type);
   for(const [label,title,offset] of [['↑','위로 이동',-1],['↓','아래로 이동',1]]){
     const button=make('button',label);button.type='button';button.title=title;button.setAttribute('aria-label',title);button.disabled=!editBlocks[index+offset];button.onclick=()=>moveBlock(index,offset);controls.append(button);
   }
   const remove=make('button','×');remove.type='button';remove.setAttribute('aria-label','블록 삭제');
   remove.onclick=()=>{editBlocks.splice(index,1);blockUploads.delete(block.id);paintBlockEditor()};controls.append(remove);
   row.append(controls);
   if(block.type!=='divider'){
     const url=mediaBlocks.has(block.type),input=document.createElement(url?'input':'textarea');
     if(url){input.type='url';input.placeholder='https://…';input.setAttribute('aria-label',blockNames[block.type]+' 주소')}

     input.oninput=()=>{block.text=input.value;if(url&&input.value){blockReadRequests.delete(block.id);delete block.asset;delete block.data;blockUploads.delete(block.id)}};
     input.onkeydown=event=>{if(event.key==='/'&&!input.value){event.preventDefault();type.focus();try{type.showPicker?.()}catch{}}};
     row.append(input);
     if(focus===block.id)queueMicrotask(()=>input.focus());
     if(block.type==='todo'){
       const label=make('label',''),check=document.createElement('input');
       check.type='checkbox';check.checked=block.checked;check.onchange=()=>{block.checked=check.checked};
       label.append(check,'완료');row.append(label);
     }
     const accepted={image:'image/png,image/jpeg,image/webp,image/gif,image/avif',pdf:'application/pdf,.pdf',embed:'video/mp4,video/webm',audio:'audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/webm'}[block.type];
     if(accepted){
       const file=document.createElement('input');file.type='file';file.accept=accepted;

       row.append(file);
       if(block.asset||block.data||blockUploads.has(block.id))row.append(make('p',blockUploads.get(block.id)?.name||block.asset?.name||block.name||'파일 첨부됨','block-filename'));
     }
   }
   list.append(row);

}
const audioTypes={'audio/mpeg':'mp3','audio/wav':'wav','audio/ogg':'ogg','audio/mp4':'m4a','audio/webm':'weba'};
function supportedBlockFile(type,file){
 return type==='image'?Boolean(imageTypes[file.type]):type==='pdf'?isPdf(file):type==='audio'?Boolean(audioTypes[file.type]):type==='embed'&&Boolean(videoTypes[file.type]);
}
async function attachBlockFile(block,file){
 if(!supportedBlockFile(block.type,file)){el('error').textContent='이 블록에 맞는 파일 형식을 선택해 주세요.';return}
 const current=session,type=block.type;
 const request=newId();blockReadRequests.set(block.id,request);
 blockReads++;el('save').disabled=true;el('error').textContent='';
 try{
   if(type==='pdf'&&!(await file.slice(0,1024).text()).includes('%PDF-'))throw Error('PDF 파일을 읽을 수 없어요.');
   const data=folder?(type==='image'?await previewImage(file):''):await readDataUrl(type==='pdf'?file.slice(0,file.size,'application/pdf'):file);
   if(current!==session||blockReadRequests.get(block.id)!==request||!editBlocks.includes(block)||block.type!==type)return;
   block.text='';block.name=file.name;block.data=data||undefined;delete block.asset;
   if(folder)blockUploads.set(block.id,file);else blockUploads.delete(block.id);
   paintBlockEditor();
 }catch(error){if(current===session)el('error').textContent=error.message||'파일을 읽을 수 없어요.'}

}
function setupBlocks(card,kind){

function taggedText(container,value){
 const tokens=value.split(/(\[\[[^\]\n]{1,100}\]\])/g);
 for(const part of tokens){
   if(/^\[\[.+\]\]$/.test(part)){
     const tag=make('button',part,'block-tag');
     tag.onclick=()=>{el('search').value=part;render()};
     container.append(tag);
   }else container.append(document.createTextNode(part));
 }
}
function validBlock(block){
 if(!block||typeof block.id!=='string'||!Object.hasOwn(blockNames,block.type)||typeof block.text!=='string'||typeof block.checked!=='boolean')return false;
 if(block.name!==undefined&&typeof block.name!=='string')return false;
 if(block.asset&&!validAsset(block.asset))return false;
 if(!block.data)return true;
 if(typeof block.data!=='string')return false;
 if(block.type==='image')return safeImage.test(block.data);
 if(block.type==='pdf')return pdfPattern.test(block.data);
 if(block.type==='audio')return /^data:audio\/(mpeg|wav|ogg|mp4|webm);base64,[a-z0-9+/=]+$/i.test(block.data);

function validAsset(asset){

function editTextBlock(node,card,block){
 if(freeInk||node.querySelector('textarea')||surface.querySelector('.inline-edit'))return;

   catch{save.disabled=false;alert('블록을 저장하지 못했어요.')}

function renderBlocks(article,card){

 for(const block of card.blocks){
   const {type,text}=block,url=mediaBlocks.has(type)?httpUrl(text):null;
   if(type==='divider'){content.append(make('hr',''));continue}

     const line=make('label','','check-block'),input=document.createElement('input'),textNode=make('span','');

       const latest=cards.find(item=>item.id===card.id)||card;

   }
   if(type==='list'){

function transaction(mode,operation,storeName='cards'){

     if(!after)cards=cards.filter(card=>card.id!==id);
     else if(cards.some(card=>card.id===id))cards=cards.map(card=>card.id===id?after:card);
     else cards=[after,...cards];
   };
